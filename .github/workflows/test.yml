name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check the web modules
        run: for f in web/js/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Unit tests
        run: npm test
