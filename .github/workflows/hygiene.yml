# Fails a pull request or a push to main that adds a cache folder or a file over 10 MB.
# The largest real asset (the MediaPipe wasm) is 9 MB.
name: hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-bloat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block caches and files over 10 MB
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          bad=0
          while IFS= read -r f; do
            case "$f" in
              node_modules/*|*/node_modules/*|.npm-cache/*|.npm/*|.pnpm-store/*|.cache/*|.wrangler/*|.local/*)
                echo "::error file=$f::cache or local-only folder committed"; bad=1 ;;
            esac
            if [ -f "$f" ] && [ "$(stat -c%s "$f")" -gt 10485760 ]; then
              echo "::error file=$f::file is over 10 MB"; bad=1
            fi
          done < <(git diff --name-only --diff-filter=AM "$BASE" HEAD)
          [ "$bad" = 0 ] && echo "No caches or oversized files added."
          exit "$bad"
